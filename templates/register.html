{%extends "base.html" %}

{% block title %}
Register - Trekking Management System
{% endblock %}

{% block content %}
<div class="register-container">
    <form action="/register" method="post">

        <div class="mb-3 row">
            <div class="col-sm-10">
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    id="name"
                    placeholder="Full Name"
                    required>
            </div>
        </div>

        <div class="mb-3 row">
            <div class="col-sm-10">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    id="email"
                    placeholder="Email"
                    required>
            </div>
        </div>

        <div class="mb-3 row">
            <div class="col-sm-10">
                <div class="input-group">
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        id="password"
                        placeholder="Password"
                        required>

                    <span class="input-group-text" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col-sm-10">
                <div class="input-group">
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        id="confirm_password"
                        placeholder="Confirm Password"
                        required>

                    <span class="input-group-text" id="toggleConfirmPassword">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col-sm-10">
                <label for="role" class="col-sm-2 col-form-label">
                    I am a
                </label>
                <select name="role" class="form-select" id="role" required>
                    <option value="" disabled selected>--Select Role--</option>
                    <option value="user">User</option>
                    <option value="trek_staff">Trek Staff</option>
                </select>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                Register
            </button>
        </div>

    </form>
    <div class="mt-3">
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}
