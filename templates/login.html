{% extends "base.html" %}

{% block title %}
Login - Trekking Management System
{% endblock %}

{% block content %}
<div class="login-container">
    <form action="/login" method="post">

        <div class="mb-3 row">
            <label for="email" class="col-sm-2 col-form-label">
                Email Address
            </label>
            <div class="col-sm-10">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>
        </div>

        <div class="mb-3 row">
            <label for="password" class="col-sm-2 col-form-label">
                Password
            </label>
            <div class="col-sm-10">
                <div class="input-group">
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <span class="input-group-text" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                Login
            </button>
        </div>

    </form>
</div>
{% endblock %}
