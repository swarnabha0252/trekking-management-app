<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="{{ url_for('admin.admin_dashboard') }}">
                Trekking Management Application
            </a>

            <div class="ms-auto">
                <span class="navbar-text text-white">
                    👤 {{ session["name"] }}
                </span>
            </div>

        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <div class="col-lg-2 bg-light min-vh-100 p-3 shadow-sm">

                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="{{ url_for('admin.admin_dashboard') }}">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.manage_treks') }}">Treks</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.manage_staff') }}">Staff</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.manage_users') }}">Users</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Bookings</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Search</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Reports</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Settings</a>
                    </li>

                    <li class="nav-item mt-3">
                        <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">
                            Logout
                        </a>
                    </li>

                </ul>

            </div>

            <div class="col-lg-10 p-4">

                <h2 class="mb-4">Dashboard</h2>

                <div class="row">

                    <div class="col-md-3 mb-4">
                        <div class="card text-center shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Total Treks</h5>
                                <h2>{{total_treks}}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-4">
                        <div class="card text-center shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Total Users</h5>
                                <h2>{{total_users}}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-4">
                        <div class="card text-center shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Total Staff</h5>
                                <h2>{{total_staff}}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-4">
                        <div class="card text-center shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Total Bookings</h5>
                                <h2>{{total_bookings}}</h2>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

</body>

</html>
